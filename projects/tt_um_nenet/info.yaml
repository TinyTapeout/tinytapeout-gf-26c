# Tiny Tapeout project information
project:
  title:        "NeNet"      # Project title
  author:       "Jiri KOLMAN"      # Your name
  discord:      "kolman-ic"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Neural Network"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  #top_module:  "tt_um_nenet"
  top_module:  "tt_um_nenet"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "gate_c.v"
    - "BUFG.v"
    - "FDCE.v"
    - "IBUF.v"
    - "LUT1.v"
    - "LUT2.v"
    - "LUT3.v"
    - "LUT4.v"
    - "LUT5.v"
    - "LUT6.v"
    - "MUXF7.v"
    - "CARRY4.v"
    - "OBUF.v"
    - "VCC.v"
    - "GND.v"
    - "top_nenet.v"
    - "tt_um_nenet.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "din_i[0]"
  ui[1]: "din_i[1]"
  ui[2]: "din_i[2]"
  ui[3]: "din_i[3]"
  ui[4]: "din_i[4]"
  ui[5]: "din_i[5]"
  ui[6]: "clr_n_i"
  ui[7]: "start_i"

  # Outputs
  uo[0]: "dout_o[0]"
  uo[1]: "dout_o[1]"
  uo[2]: "dout_o[2]"
  uo[3]: "dout_o[3]"
  uo[4]: "dout_o[4]"
  uo[5]: "dout_o[5]"
  uo[6]: "free_o[6]"
  uo[7]: "ack_o"

  # Bidirectional pins
  uio[0]: "dio_io[0]"
  uio[1]: "dio_io[1]"
  uio[2]: "dio_io[2]"
  uio[3]: "dio_io[3]"
  uio[4]: "dio_io[4]"
  uio[5]: "dio_io[5]"
  uio[6]: "dio_io[6]"
  uio[7]: "dio_io[7]"

# Do not change!
yaml_version: 6
