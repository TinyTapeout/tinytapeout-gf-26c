# Tiny Tapeout project information
project:
  title:        "Glyph VGA Clock"      # Project title
  author:       "Ken Pettit"      # Your name
  discord:      "busy_courgette_50064"
  description:  "VGA clock and calendar with the hexagonal Glyph watch face"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25175000      # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pettit_glyph"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "glyph_clock.v"
    - "glyph_face.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Hour+ / Month+ / Color+"
  ui[1]: "Minute+ / Day+ / Digits on-off"
  ui[2]: "Buttons set color and digits"
  ui[3]: "Grid off"
  ui[4]: "Show date"
  ui[5]: "Mode: medium"
  ui[6]: "Mode: easy"
  ui[7]: "Fast (demo)"

  # Outputs
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  # Bidirectional pins
  uio[0]: "Readback value bit 0"
  uio[1]: "Readback value bit 1"
  uio[2]: "Readback value bit 2"
  uio[3]: "Readback value bit 3"
  uio[4]: "Readback select bit 0"
  uio[5]: "Readback select bit 1"
  uio[6]: "Readback select bit 2"
  uio[7]: ""

# Do not change!
yaml_version: 6
