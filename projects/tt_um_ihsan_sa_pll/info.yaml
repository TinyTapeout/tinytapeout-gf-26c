# Tiny Tapeout project information
project:
  title:        "Charge-Pump PLL"      # Project title
  author:       "Ihsan Salari"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Charge-pump PLL with a divide-by-8 prescaler and a programmable feedback divider (N = 1-5)"      # One line description of what your project does
  language:     "Analog" # a hard analog macro and Verilog, hardened together into one GDS
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x2"          # Valid values for analog projects: 1x2, 2x2, 3x2, 4x2

  # How many analog pins does your project use?
  analog_pins: 2        # Valid values: 0 to 6
  uses_vapwr: false     # Set to true if your project uses the second analog power supply (VAPWR) in addition to VDPWR (3.3V)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ihsan_sa_pll"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  # blocks/pll/tt/assemble.py copies them in: project.v and pll_analog.v from
  # blocks/pll/tt/src, the rest from blocks/pll/digital/rtl.
  source_files:
    - "project.v"
    - "ihsan_sa_pll.v"
    - "pll_prescaler.v"
    - "pll_divider.v"
    - "pll_pfd.v"
    - "pll_lock_det.v"
    - "pll_ctrl_regs.v"
    - "pll_analog.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "N_SEL[0]"
  ui[1]: "N_SEL[1]"
  ui[2]: "N_SEL[2]"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: "PLL_EN"
  ui[7]: "OBS_SEL"

  # Outputs
  uo[0]: "OBS_OUT (VCO/8, or VCO/16 when OBS_SEL)"
  uo[1]: "CLK_FB (VCO/8N)"
  uo[2]: "LOCK"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "CP_TRIM[0] (input)"
  uio[1]: "CP_TRIM[1] (input)"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "VCTRL (loop filter node, high-impedance probe only)"
  ua[1]: "BIAS_REF (optional external bias resistor)"
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
