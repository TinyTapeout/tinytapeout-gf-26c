# Tiny Tapeout project information
project:
  title:        "Tiny Driver"
  author:       "Matthew Embaye"
  discord:      "membaye"
  description:  "A pseudo 3D racing game, drive until it's night! VGA, Gamepad Pmod, and 1-bit audio"
  language:     "Verilog"
  clock_hz:     25175000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tinydriver"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_tinydriver.v"
    - "vga.v"
    - "controls.v"
    - "gamepad.v"
    - "gamelogic.v"
    - "depthdivider.v"
    - "lines.v"
    - "renderer.v"
    - "car.v"
    - "score.v"
    - "audio.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "STEER_L"
  ui[1]: "STEER_R"
  ui[2]: "THROTTLE"
  ui[3]: "BRAKE"
  ui[4]: "PMOD_LATCH"
  ui[5]: "PMOD_CLK"
  ui[6]: "PMOD_DATA"
  ui[7]: "START"

  # Outputs
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSYNC"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSYNC"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: "AUDIO (Audio Pmod)"

# Do not change!
yaml_version: 6
