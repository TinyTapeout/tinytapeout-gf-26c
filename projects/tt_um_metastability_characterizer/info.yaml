# Tiny Tapeout project information
project:
  title:        "Metastability Characterizer"
  author:       "Benjamin J. Eisenberg, Roshan Hegde"
  discord:      ""
  description:  "Counts unresolved metastable events in four flip-flop designs on GF180 silicon"
  language:     "Analog"
  clock_hz:     20000000

  tiles: "1x2"
  analog_pins: 1
  uses_vapwr: false

  top_module:  "tt_um_metastability_characterizer"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: "dut_select[0]"
  ui[4]: "start"
  ui[5]: ""
  ui[6]: "data_in"
  ui[7]: ""

  # Outputs
  uo[0]: "event_count[0]"
  uo[1]: "event_count[1]"
  uo[2]: "event_count[2]"
  uo[3]: "event_count[3]"
  uo[4]: "event_count[4]"
  uo[5]: "event_count[5]"
  uo[6]: "event_count[6]"
  uo[7]: "event_count[7]"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: "busy"
  uio[2]: "done"
  uio[3]: "fault"
  uio[4]: "capture_monitor"
  uio[5]: "early_monitor"
  uio[6]: "dut_select[1]"
  uio[7]: ""

  # Analog pins
  ua[0]: "delay_control"
  ua[1]: ""
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
