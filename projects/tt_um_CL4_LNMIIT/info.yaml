# Tiny Tapeout project information
# Tiny Tapeout project information
project:
  title:        "CL4_LNMIIT_05"      # Project title
  author:       "Rishabh Agrawal, Ankit Mawle"      # Your name
  discord:      "rishabh.8647"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "4 Bit Digital Combinational Lock ASIC prototype with PIN verification, attempt tracking, timeout handling, and RGB lock-status indication."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_CL4_LNMIIT"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "button_debounce.v"
    - "code_compare.v"
    - "combo_lock.v"
    - "entry_fsm.v"
    - "failure_counter.v"
    - "press_qualify.v"
    - "reset_sync.v"
    - "shared_time.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "BTN_0"
  ui[1]: "BTN_1"
  ui[2]: "BTN_2"
  ui[3]: "BTN_3"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "LOCK_STATE"
  uo[1]: "LOCKED_OUT_STATE"
  uo[2]: "ATTEMPT_COUNT_0"
  uo[3]: "ATTEMPT_COUNT_1"
  uo[4]: "STATE_1" # red rgb pin
  uo[5]: "STATE_2" # green rgb pin
  uo[6]: "STATE_3" # blue rgb pin
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
